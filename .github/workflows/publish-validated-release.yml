name: Publish validated release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build IPA run to publish
        required: true
      tag:
        description: Existing main-branch release tag matching the IPA versions
        required: true
      ios_sha256:
        description: SHA-256 of the verified iPhone/iPad IPA
        required: true
      tvos_sha256:
        description: SHA-256 of the verified Apple TV IPA
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-flarestore
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.run_id }}
      IOS_SHA256: ${{ inputs.ios_sha256 }}
      TVOS_SHA256: ${{ inputs.tvos_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate the build and main-branch tag
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          tag, run = os.environ['RELEASE_TAG'], os.environ['BUILD_RUN']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Invalid release tag'
          assert re.fullmatch(r'\d+', run), 'Invalid build run'
          for key in ['IOS_SHA256', 'TVOS_SHA256']:
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ[key]), 'Invalid digest'
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/actions/runs/{run}']))
          assert data['conclusion'] == 'success' and data['name'] == 'Build IPA', 'Build must have passed'
          assert data['path'] == '.github/workflows/build-ipa.yml', 'Unexpected producer workflow'
          target = git('rev-parse', tag + '^{commit}')
          subprocess.run(['git', 'merge-base', '--is-ancestor', target, 'origin/main'], check=True)
          assert git('rev-parse', target + '^{tree}') == git('rev-parse', data['head_sha'] + '^{tree}'), 'Tag must exactly match tested source'
          # Generate the source using the tested revision's script, not newer unbuilt code.
          subprocess.run(['git', 'checkout', '--detach', target], check=True)
          print('Passed build, main ancestry and identical source tree verified.')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: AIOStreams*-ipa
          path: build
          merge-multiple: true
      - name: Verify IPA digests and read previous source history
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          for name, key in [('AIOStreams.ipa', 'IOS_SHA256'), ('AIOStreams-tvOS.ipa', 'TVOS_SHA256')]:
              assert hashlib.sha256((Path('build') / name).read_bytes()).hexdigest() == os.environ[key], 'IPA digest mismatch'
          print('Both IPA digests verified.')
          PY
          mkdir -p build/previous
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern source.json --dir build/previous
          fi
      - name: Generate source and publish all assets together
        run: |
          args=()
          if [ -f build/previous/source.json ]; then
            args+=(--previous build/previous/source.json)
          fi
          python3 scripts/update-source.py "$RELEASE_TAG" "${args[@]}"
          cat > build/release-notes.md <<'EOF'
          Player gestures, light haptics and playback preferences

          - Left-side brightness swipes and right-side system-volume swipes with a loudness-preserving handoff.
          - Light feedback for play/pause, seeking and track selection, with spaced level-change ticks.
          - Higher brightness/volume notices and readable settings labels, including Smaller subtitles.
          - Settings → Playback → iPhone and iPad: Haptic feedback, Player gestures and Fill screen on start. Fill crops edges without stretching; controls remain usable with gestures disabled.
          - Existing native subtitle styling preserved.

          Unsigned iPhone/iPad and Apple TV IPAs. Your sideloading tool signs them at installation.
          Refresh this FlareStore/AltStore-format source for the update:
          https://raw.githubusercontent.com/9pbpsvr6f9-alt/aiostreams-ios/main/altstore/source.json

          Publishes the exact checksum-verified artifacts from a passing Build IPA run, whose source tree matches the main-branch tag. Web/browser checks, Swift volume/haptic tests and both device builds passed on the Intel fallback after hosted ARM capacity failures. Physical haptic strength and audio-route behavior still require device testing.
          EOF
          printf '\nValidated build: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$BUILD_RUN" >> build/release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > build/release-state.json; then
            python3 - <<'PY'
          import json
          assert json.load(open('build/release-state.json'))['isDraft'], 'Refusing to overwrite a public release'
          PY
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AIOStreams ${RELEASE_TAG#v}" --notes-file build/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md
          gh release upload "$RELEASE_TAG" build/AIOStreams.ipa build/AIOStreams-tvOS.ipa altstore/source.json altstore/icon.png --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Update the source on main
        run: |
          cp altstore/source.json build/source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B source-update origin/main
            cp build/source.json altstore/source.json
            git add altstore/source.json
            if git diff --cached --quiet; then echo "Source on main already current"; exit 0; fi
            git commit -q -m "FlareStore source: $RELEASE_TAG"
            if git push -q origin source-update:main; then echo "Source on main updated"; exit 0; fi
            echo "main moved; trying again"
            sleep 5
          done
          echo "::error::Could not update altstore/source.json on main"
          exit 1
