name: Screenshots

# Photographs both apps in the simulators against the demo server, whose catalogue and artwork are
# made up (tools/demo-server). Run by hand from the Actions tab; the pictures come back as an artifact.
on:
  workflow_dispatch:

permissions:
  # Pushes the pictures to the screenshots branch, where they can be looked at and picked from.
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build the web app
        run: scripts/build-web.sh

      - name: Install tools
        run: |
          brew install xcodegen ffmpeg
          python3 -m pip install --break-system-packages pillow

      - name: Take the screenshots
        run: scripts/screenshots.sh

      - name: Demo server log
        if: always()
        run: tail -n 200 build/demo-server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn

      - name: Push to the screenshots branch
        if: always()
        run: |
          shopt -s nullglob
          files=(build/screenshots/*.png build/demo-server.log)
          [ ${#files[@]} -gt 0 ] || exit 0
          keep=$(mktemp -d)
          cp "${files[@]}" "$keep/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq --cached .
          git clean -fdxq
          cp "$keep"/* .
          git add .
          git commit -qm "Screenshots from run ${{ github.run_id }}"
          git push -f origin screenshots
