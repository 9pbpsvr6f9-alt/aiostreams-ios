name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      aiostreams_ref:
        description: Web source override (candidate builds only)
        required: false
        default: ''
      height_channels:
        description: Include optional height channels (candidate builds only)
        type: boolean
        default: false
      runner:
        description: Candidate runner (Intel fallback for hosted ARM capacity problems)
        type: choice
        options:
          - macos-26
          - macos-15-intel
        default: macos-26
      platform:
        description: Platforms to build (single-platform candidates cannot publish)
        type: choice
        options: [both, ios, tvos]
        default: both
      publish_release:
        description: Publish both IPAs and the FlareStore source after successful builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event and branch: a merged PR's build runs under main's ref, and must not cancel main's release.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    env:
      AIOSTREAMS_REF: ${{ inputs.aiostreams_ref }}
      HEIGHT_CHANNELS: ${{ inputs.height_channels && 'on' || 'off' }}
      RELEASE_VERSION: 0.2.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Run distribution tests
        run: python3 -m unittest discover -s tests -v
      - name: Test swipe volume normalization
        run: cat AIOStreams/Sources/SwipeVolume.swift tests/SwipeVolumeTests.swift | swift -
      - name: Test player haptic gating
        run: cat AIOStreams/Sources/PlayerHapticPolicy.swift tests/PlayerHapticPolicyTests.swift | swift -
      - name: Test native trailer placement
        run: cat AIOStreams/Sources/VideoFrame.swift tests/VideoFrameTests.swift | swift -
      - name: Test Picture in Picture eligibility and restoration
        run: cat AIOStreams/Sources/PictureInPicturePolicy.swift tests/PictureInPicturePolicyTests.swift | swift -
      - name: Test next episode preloading
        run: cat AIOStreams/Sources/NextEpisodePreloader.swift tests/NextEpisodePreloaderTests.swift | swift -
      - name: Test download file placement
        run: cat AIOStreams/Sources/DownloadPlaces.swift tests/DownloadPlacesTests.swift | swift -
      - name: Set unique installable version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('project.yml')
          text = re.sub(r'MARKETING_VERSION: "[^"]+"', 'MARKETING_VERSION: "' + os.environ['RELEASE_VERSION'] + '"', p.read_text())
          text = re.sub(r'CURRENT_PROJECT_VERSION: "[^"]+"', 'CURRENT_PROJECT_VERSION: "' + os.environ['BUILD_NUMBER'] + '"', text)
          p.write_text(text)
          PY
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the web app
        run: |
          [ -n "$AIOSTREAMS_REF" ] || unset AIOSTREAMS_REF
          scripts/build-web.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the iOS IPA
        if: inputs.platform != 'tvos'
        run: scripts/make-ipa.sh ios
      - name: Build the tvOS IPA
        if: inputs.platform != 'ios'
        run: scripts/make-ipa.sh tvos
      - uses: actions/upload-artifact@v4
        if: inputs.platform != 'tvos'
        with:
          name: AIOStreams-ipa
          path: build/AIOStreams.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.platform != 'ios'
        with:
          name: AIOStreams-tvOS-ipa
          path: build/AIOStreams-tvOS.ipa
          if-no-files-found: error

  release:
    needs: build
    # No PR can publish. Experimental engine traits and web overrides are candidates only.
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release)) &&
      !inputs.height_channels && !inputs.aiostreams_ref &&
      (!inputs.runner || inputs.runner == 'macos-26') &&
      (!inputs.platform || inputs.platform == 'both')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-flarestore
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.${{ github.run_number }}
    steps:
      # Full history and tags, for the release notes since the previous release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: AIOStreams*-ipa
          path: build
          merge-multiple: true
      - name: Retrieve previous source history
        run: |
          mkdir -p build/previous
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern source.json --dir build/previous
          fi
      - name: Generate verified FlareStore source
        run: |
          args=()
          if [ -f build/previous/source.json ]; then
            args+=(--previous build/previous/source.json)
          fi
          # What changed: the titles of the commits since the previous release, merges left out.
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
            # -n, not a pipe to head: the runner's pipefail would fail on head closing early.
            git log --no-merges -n 12 --format='%s' "$previous..HEAD" > build/notes.txt
          fi
          [ -s build/notes.txt ] || git log -1 --format='%s' > build/notes.txt
          args+=(--notes build/notes.txt)
          python3 scripts/update-source.py "$RELEASE_TAG" "${args[@]}"
      - name: Publish IPAs and source together
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## What's new"
            sed 's/^/- /' build/notes.txt
            echo
          } > build/release-notes.md
          cat >> build/release-notes.md <<'EOF'
          Unsigned iPhone/iPad and Apple TV IPAs, built from the commit linked to this release.
          Sign and install with your sideloading tool. FlareStore source:
          https://github.com/9pbpsvr6f9-alt/aiostreams-ios/releases/latest/download/source.json
          Updates become available when you refresh this source; installation and signing remain under your control.
          EOF
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --title "AIOStreams ${RELEASE_TAG#v}" --notes-file build/release-notes.md
          gh release upload "$RELEASE_TAG" build/AIOStreams.ipa build/AIOStreams-tvOS.ipa altstore/source.json altstore/icon.png
          gh release edit "$RELEASE_TAG" --draft=false --latest
